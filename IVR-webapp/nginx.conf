server {
    listen 80;
    server_name localhost;

    # Serve static frontend files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Fallback to index.html for React Router SPA
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api/payments/ (with trailing slash) to the payment service backend container
    location /api/payments/ {
        proxy_pass http://ivr-payment-service:8082/nexusivr-payment-service/api/payments/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy /api/payments (without trailing slash) to the payment service backend container
    location /api/payments {
        proxy_pass http://ivr-payment-service:8082/nexusivr-payment-service/api/payments;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy /nexusivr-ai-engine/api/payments to payment service (in case legacy URL is called)
    location /nexusivr-ai-engine/api/payments {
        proxy_pass http://ivr-payment-service:8082/nexusivr-payment-service/api/payments;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy /nexusivr-ai-engine/api/ requests to the AI engine backend container
    location /nexusivr-ai-engine/api/ {
        proxy_pass http://ivr-ai-engine:8081/nexusivr-ai-engine/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy /api/ requests to the AI engine backend container
    location /api/ {
        # 'ivr-ai-engine' is the name of the docker-compose service
        proxy_pass http://ivr-ai-engine:8081/nexusivr-ai-engine/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
