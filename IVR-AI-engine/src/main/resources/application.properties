# ============================================================
# NexusIVR AI Backend — Application Properties
# ============================================================
# All secrets and environment-specific values are read from
# environment variables (set in .env or the OS environment).
# This file only stores non-secret defaults and documentation.
# ============================================================

# AI Provider — override with env var AI_PROVIDER
# Changed to gemini; Groq remains wired as the 429-fallback provider.
ai.provider=gemini

# Gemini — override individual values with env vars:
#   GEMINI_API_KEY, GEMINI_MODEL, GEMINI_BASE_URL, GEMINI_TIMEOUT
gemini.model=gemini-2.0-flash
gemini.model.planning=gemini-2.0-flash
gemini.model.generation=gemini-2.0-flash
gemini.baseUrl=https://generativelanguage.googleapis.com/v1beta
gemini.timeout=30

# Groq — secondary/fallback provider; override with env vars:
#   GROQ_API_KEY, GROQ_MODEL, GROQ_BASE_URL, GROQ_TIMEOUT
groq.model=llama-3.3-70b-versatile
groq.model.planning=llama-3.1-8b-instant
groq.model.generation=llama-3.3-70b-versatile
groq.baseUrl=https://api.groq.com/openai/v1
groq.timeout=30

# Ollama — override with env vars:
#   OLLAMA_BASE_URL, OLLAMA_MODEL, OLLAMA_TIMEOUT
ollama.baseUrl=http://localhost:11434
ollama.model=granite3.2:2b
ollama.timeout=60

# Database — override with env vars:
#   DATABASE_URL, DATABASE_USER, DATABASE_PASSWORD
db.url=jdbc:postgresql://localhost:5432/nexusivr
db.user=nexusivr