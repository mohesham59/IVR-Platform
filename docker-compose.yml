version: '3.8'

services:
  # 1. Asterisk PBX
  asterisk:
    image: andrius/asterisk:latest
    container_name: ivr-asterisk
    # Using host network mode is easiest for VoIP/SIP/RTP so we don't have to map a huge range of RTP ports
    network_mode: "host"
    volumes:
      # Map the host machine's asterisk config directory to the container
      - /etc/asterisk:/etc/asterisk
      # Mount the run directory to host so other containers can access the asterisk socket
      - /var/run/asterisk:/var/run/asterisk
      # Share audio/sounds directory so the webapp can upload/generate TTS directly to Asterisk
      - ./asterisk-sounds:/var/lib/asterisk/sounds
      # Share the host /dev/shm so AGI <record>/<ai> recordings written by
      # Asterisk are visible to the IVR engine (which runs in its own container)
      - /dev/shm:/dev/shm
      # Persist CDR CSV output on the host (asterisk writes Master.csv here;
      # also gives the dashboard a data source for call analytics)
      - ./asterisk-cdr:/var/log/asterisk/cdr-csv
    restart: unless-stopped

  # 2. IVR Engine (FastAGI Server)
  ivr-engine:
    build:
      context: ./IVR-engine
      dockerfile: Dockerfile
    container_name: ivr-engine
    # Using host network so Asterisk can easily reach it on localhost:4573
    network_mode: "host"
    volumes:
      # Map scenarios so VXML files can be updated live without rebuilding
      - ./IVR-engine/scenarios:/app/scenarios
      # Share sounds directory so generated TTS/custom audio is visible to Asterisk
      - ./asterisk-sounds:/var/lib/asterisk/sounds
      # Share the host /dev/shm so the engine can read AGI <record>/<ai>
      # recordings written there by the Asterisk container
      - /dev/shm:/dev/shm
    environment:
      # Use granite4.1:8b as requested
      - OLLAMA_MODEL=granite4.1:8b
      # Database connection for storing call analytics
      - DATABASE_URL=jdbc:postgresql://ep-empty-cell-ay0ibimz-pooler.c-5.us-east-2.aws.neon.tech/neondb?sslmode=require
      - DATABASE_USER=neondb_owner
      - DATABASE_PASSWORD=npg_6OuHh2PKRUWk
    restart: unless-stopped

  # 3. IVR AI Engine (REST API)
  ivr-ai-engine:
    build:
      context: ./IVR-AI-engine
      dockerfile: Dockerfile
    container_name: ivr-ai-engine
    ports:
      - "8081:8081"
    volumes:
      # Share scenarios folder with ivr-engine
      - ./IVR-engine/scenarios:/app/IVR-engine/scenarios
      # Share add_extension.sh script
      - ./IVR-engine/add_extension.sh:/app/IVR-engine/add_extension.sh
      # Mount asterisk config so add_extension.sh can edit extensions.conf
      - /etc/asterisk:/etc/asterisk
      # Mount asterisk run directory so 'asterisk -rx' works
      - /var/run/asterisk:/var/run/asterisk
      # Mount shared sounds directory so uploads/TTS save directly into Asterisk
      - ./asterisk-sounds:/var/lib/asterisk/sounds
      # Mount CDR output so the analytics API can read call records
      - ./asterisk-cdr:/var/log/asterisk/cdr-csv
    env_file:
      # Pass the LLM provider + API keys from the repo-local .env
      - ./IVR-AI-engine/.env
    environment:
      # Use host.docker.internal to talk to the local Ollama instance running on the host
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      # Connect to the remote NeonDB instance (extracted from application.properties / .env)
      - DATABASE_URL=jdbc:postgresql://ep-empty-cell-ay0ibimz-pooler.c-5.us-east-2.aws.neon.tech/neondb?sslmode=require
      - DATABASE_USER=neondb_owner
      - DATABASE_PASSWORD=npg_6OuHh2PKRUWk
      # Point to Asterisk on the host
      - AMI_HOST=host.docker.internal
    # Need this to resolve host.docker.internal on Linux hosts
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # 4. IVR WebApp (React Frontend)
  ivr-webapp:
    build:
      context: ./IVR-webapp
      dockerfile: Dockerfile
    container_name: ivr-webapp
    ports:
      - "3000:80"
    depends_on:
      - ivr-ai-engine
    restart: unless-stopped
